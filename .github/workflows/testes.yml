name: Testes do SignGlove

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes-python:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: libras_tcc/requirements-test.txt

      - name: Instalar dependências dos testes
        run: python -m pip install -r libras_tcc/requirements-test.txt

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Verificar sintaxe Python
        run: python -m compileall -q libras_tcc tests

      - name: Validar dataset
        run: python libras_tcc/training/diagnosticar_projeto.py --strict
